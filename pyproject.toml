[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairtable"
version = "0.1.0"
description = "FairTable: a self-hosted MCP server that gives independent restaurants a trusted front door for AI booking agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp==3.4.7",
    "mcp==1.30.0",       # do NOT upgrade to 2.x
    "cedarpy==4.12.1",
    "joserfc==1.7.5",
    "pydantic==2.13.5",
    "boto3==1.43.104",
    "httpx==0.28.1",
]

[project.optional-dependencies]
web = ["fastapi==0.141.1", "uvicorn==0.54.0", "mangum==0.22.0", "python-multipart==0.0.32"]
sim = ["strands-agents==1.57.1", "openai==2.54.0"]   # openai: only for MODEL_PROVIDER=deepseek (Strands' OpenAIModel imports it)
eval = ["pyyaml==6.0.3"]   # task files for the evaluation harness (strands-agents already depends on it)
voice = ["strands-agents[bidi]==1.57.1", "websockets==17.1"]   # the voice page (Amazon Nova 2 Sonic, D-052): AWS only, never in the Docker image
tasks = ["pydocket==0.25.2"]   # optional MCP Tasks view (D-010), default off
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.12.0"]

[tool.setuptools.packages.find]
include = ["server*", "devauth*", "web*", "simulator*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests/integration", "."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "ddb: needs DynamoDB Local (docker compose -f infra/local/docker-compose.yml up -d)",
    "docker: needs the full docker compose stack",
    "aws: needs real AWS resources (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
